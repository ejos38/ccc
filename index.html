<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscriptions CCC</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 10px auto; padding: 10px; color: #333; }
        .zone-entete { display: flex; flex-direction: column; gap: 15px; margin-bottom: 5px !important; }
        .zone-onglets { display: flex; gap: 6px; flex-wrap: wrap; }
        .onglet { background: #f1f3f5; color: #495057; border: 1px solid #ced4da; padding: 8px 12px; font-weight: bold; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .onglet.actif { background: #007BFF; color: white; border-color: #007BFF; }
        
	/* FORCE ce bloc à s'étirer au maximum pour occuper tout l'espace de gauche */
        .bloc-affichage-carrousel { 
            display: flex; 
            flex-direction: column; 
            flex: 1 !important; /* Prend tout le reste de la largeur disponible */
            min-width: 0; /* Sécurité anti-débordement pour le navigateur */
        }
         /* Verrouillage de la barre pour aligner horizontalement les 4 badges */
        .barre-niveaux-carrousel { 
            display: flex; 
            gap: 5px; 
            margin-bottom: 0px; 
            flex-wrap: nowrap !important; /* Interdit formellement le saut à la ligne */
        }

          .badge-niveau { 
            padding: 5px 6px !important; /* Ressert les bords gauche/droite pour gagner les pixels manquants */
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 4px 4px 0 0; 
            border: 1px solid #ccc; 
            border-bottom: none; 
            cursor: pointer; 
            background: #e9ecef; 
            color: #495057; 
            transition: all 0.2s; 
            white-space: nowrap; /* Empêche le texte de se couper */
        }


        /* Alignement direct des styles sur vos codes officiels de l'agenda */
        .badge-niveau.E-Bleu.actif { background: #5b95f9 !important; color: white !important; border-color: #5b95f9 !important; }
        .badge-niveau.E-Rouge.actif { background: #eb8bbd !important; color: white !important; border-color: #eb8bbd !important; }
        .badge-niveau.P-Rouge.actif { background: #ee4545 !important; color: white !important; border-color: #ee4545 !important; }
        .badge-niveau.P-Noir.actif { background: #434343 !important; color: white !important; border-color: #434343 !important; }
        
         /* Maintien strict du face-à-face horizontal entre le bloc et le logo */
        .conteneur-details-logo { 
            display: flex; 
            flex-direction: row !important; /* Force le maintien côte à côte */
            justify-content: space-between;
            align-items: flex-end; /* Aligne le bas du logo avec le bas de la boîte */
            gap: 12px; 
            width: 100%; 
        }
        .box-details { flex: 1; background: #f8f9fa; border-left: 4px solid #007BFF; padding: 12px; font-size: 13.5px; border-radius: 0 4px 4px 4px; line-height: 1.6; transition: all 0.2s; }
        
        /* Alignement direct des fonds pastels sur vos codes officiels de l'agenda */
        .box-details.fond-E-Bleu { background-color: #f0f4ff !important; border-left-color: #5b95f9 !important; }
        .box-details.fond-E-Rouge { background-color: #fff0f6 !important; border-left-color: #eb8bbd !important; }
        .box-details.fond-P-Rouge { background-color: #fff5f5 !important; border-left-color: #ee4545 !important; }
        .box-details.fond-P-Noir { background-color: #f1f3f5 !important; border-left-color: #434343 !important; }
 	
	/* Verrouillage strict de la largeur du logo pour qu'il ne pousse plus son voisin */
        .logo-club { 
            width: 80px !important; 
            height: 80px !important; 
            flex-shrink: 0 !important; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 2px; 
        }
        .consigne-inscription { font-size: 13px; color: #555; font-style: italic; margin: 2px 0 2px 0 !important; padding: 0 !important; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 13px; }
        th { background: #e9ecef; }
        
        /* Masquage propre du choix des boutons radios du haut */
        #table-formulaire th:not(:first-child), #table-formulaire td:not(:first-child) { display: none !important; }
        #table-formulaire { width: 100% !important; table-layout: fixed; }
        #table-formulaire th:first-child, #table-formulaire td:first-child { width: 100% !important; text-align: left; }
        
        .table-participants { width: 100%; border-collapse: collapse; margin-top: 15px; table-layout: fixed; }
        .table-participants th { padding: 10px 4px; font-size: 12px; font-weight: bold; }
        .th-nom { background-color: #b7e1cd !important; color: #000000 !important; }
        .th-bleu { background-color: #5b95f9 !important; color: #ffffff !important; }
        .th-erouge { background-color: #eb8bbd !important; color: #ffffff !important; }
        .th-prouge { background-color: #ee4545 !important; color: #ffffff !important; }
        .th-noir { background-color: #434343 !important; color: #ffffff !important; }
        
        .table-corps-participants { width: 100%; border-collapse: collapse; table-layout: fixed; }

        .table-corps-participants td { padding: 8px; border: 1px solid #ccc; text-align: center; font-size: 13px; }
        .gauche { text-align: left !important; font-weight: bold; }
        .btn-danger { background: #DC3545; display: none; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 15px; }
        button { background: #007BFF; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .nb { display: block; font-weight: bold; font-size: 11px; margin-top: 4px; color: inherit; }
        
	/* NOUVELLE RÈGLE DE VERROUILLAGE POUR LE TABLEAU DES INSCRITS */
        .zone-ascenseur { 
            width: 100%; 
            max-height: 250px; 
            overflow-y: auto; 
            overflow-x: hidden; /* Empêche le décalage horizontal de la première colonne */
        }
        .zone-ascenseur-comm { border: 1px solid #ced4da; background-color: #f0f4f8; padding: 10px; border-radius: 6px; margin-bottom: 12px; margin-top: 10px; }

        .titre-section-comm { font-size: 14px; font-weight: bold; margin: 4px 0 8px 0 !important; color: #495057; display: flex; align-items: center; }
        .pastille-jaune { width: 12px; height: 12px; background-color: #FFD700; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 4px rgba(255, 215, 0, 0.5); }
        .ligne-comm { background: #ffffff; border: 1px solid #e1e8ed; border-radius: 5px; margin: 0 0 5px 0; text-align: left; line-height: 1.3; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); }
        .bulle-nom { color: #0056b3; font-weight: bold; }
        .form-comm-horizontal { display: flex; flex-direction: row; gap: 10px; width: 100%; margin-bottom: 8px; }
        .input-comm-nom { width: 25%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .input-comm-msg { width: 75%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .zone-bouton-comm { display: flex !important; justify-content: flex-end !important; width: 100%; margin-bottom: 4px !important; }
        .zone-bouton-comm button { background-color: #28a745 !important; color: white !important; font-weight: bold; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; }
        .no-sortie { color: #dc3545; font-style: italic; }
    </style>
</head>
<body>
    <div class="zone-entete">
        <div id="barre-onglets" class="zone-onglets"></div>
        <div class="conteneur-details-logo">
            <div class="bloc-affichage-carrousel">
                <div id="carrousel-boutons" class="barre-niveaux-carrousel"></div>
                <div id="bloc-details-parcours" class="box-details">⏳ Connexion au serveur du club en cours...</div>
            </div>
            <img src="icone_CCC.jpg" alt="Logo CCC" class="logo-club">
        </div>
        <p class="consigne-inscription">Pour s'inscrire sélectionner une date puis un parcours et saisissez votre nom complet.</p>
    </div>

    <form id="form-inscription">
        <table id="table-formulaire" style="margin-bottom: 15px;">
            <thead>
                <tr><th style="width: 36%;">Nom Prénom</th><th>E-Bleu</th><th>E-Rouge</th><th>P-Rouge</th><th>P-Noir</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" id="nom" style="width:95%; padding:4px;" required placeholder="Ex: Jean Dupont"></td>
                    <td><input type="radio" name="niveau" value="E-Bleu"></td>
                    <td><input type="radio" name="niveau" value="E-Rouge"></td>
                    <td><input type="radio" name="niveau" value="P-Rouge"></td>
                    <td><input type="radio" name="niveau" value="P-Noir"></td>
                </tr>
            </tbody>
        </table>
        <div style="margin-bottom:25px;">
            <button type="submit" id="btn-valider">Valider</button>
            <button type="button" id="btn-annuler" class="btn-danger">Annuler mon inscription</button>
        </div>
    </form>

    <!-- LIBELLÉS EN DUR MODIFIABLES EN DIRECT ICI -->
    <table class="table-participants">
        <thead>
            <tr>
                <th class="th-nom" style="width: 36%; text-align: left;">Nom Prénom (<span id="total-general">0</span>)</th>
                <th class="th-bleu" style="width: 16%;">End. Bleu <span class="nb" id="count-bleu">(0)</span></th>
                <th class="th-erouge" style="width: 16%;">End. Rouge <span class="nb" id="count-erouge">(0)</span></th>
                <th class="th-prouge" style="width: 16%;">Perf. Rouge <span class="nb" id="count-prouge">(0)</span></th>
                <th class="th-noir" style="width: 16%;">Perf. Noir <span class="nb" id="count-noir">(0)</span></th>
            </tr>
        </thead>
    </table>
    
    <div class="zone-ascenseur">
        <table class="table-corps-participants">
            <tbody id="liste-participants"></tbody>
        </table>
    </div>

    <div style="height: 25px; clear: both;"></div>

    <form id="form-commentaire" class="form-comm-horizontal">
        <input type="text" id="comm-nom" class="input-comm-nom" required placeholder="Votre Nom">
        <input type="text" id="comm-msg" class="input-comm-msg" required placeholder="Écrivez un commentaire public...">
    </form>
    <div class="zone-bouton-comm">
        <button type="submit" form="form-commentaire">Envoyer mon commentaire</button>
    </div>

    <div class="titre-section-comm">
        <span class="pastille-jaune"></span> 💬 Échanges & Commentaires
    </div>
    <div class="zone-ascenseur-comm" id="liste-commentaires"></div>
   
 <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzVreBXDKZ__mtZvnQrxz6tsOCrb4wX2_-rUpLWAUuxakv7Pli1hGlWAFAMVC16M4BoPg/exec";
        
        let cacheInscrits = new Array();
        let cacheCommentaires = new Array();
        let cacheJoursSemaine = new Array();
        let idUniqueActif = "";
        let niveauSelectionneActif = "";

        // FORMULE ANTI-BUG DES DATES SÉCURISÉE (ORDRE : ANNÉE, MOIS, JOUR BLINDÉ)
        function formaterDateOption(d) {
            if (!d) return "";
            const p = d.split('/'); if (p.length !== 3) return d;
            const dateObj = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
            return dateObj.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        async function chargerDonnees() {
            try {
                const res = await fetch(API_URL); 
                const data = await res.json();
                cacheInscrits = data.inscrits || new Array(); 
                cacheCommentaires = data.commentaires || new Array(); 
                cacheJoursSemaine = data.jours || new Array();
                
                const barre = document.getElementById('barre-onglets'); 
                barre.innerHTML = "";
                
                cacheJoursSemaine.forEach((j, idx) => {
                    const btn = document.createElement('button'); 
                    btn.type = "button"; btn.className = "onglet"; btn.id = "btn_" + j.idUnique;
                    btn.innerText = formaterDateOption(j.date); 
                    btn.onclick = function() { basculerJour(j.idUnique); };
                    barre.appendChild(btn); 
                    if (idx === 0) idUniqueActif = j.idUnique;
                });
                
                const bActif = document.getElementById("btn_" + idUniqueActif); 
                if (bActif) bActif.classList.add('actif');
                
                afficherDetailsEtInscrits();
            } catch (e) { console.error(e); }
        }

        function basculerJour(idUnique) {
            document.querySelectorAll('.onglet').forEach(b => b.classList.remove('actif'));
            const bActif = document.getElementById("btn_" + idUnique); if (bActif) bActif.classList.add('actif');
            idUniqueActif = idUnique; afficherDetailsEtInscrits();
        }

        function afficherDetailsEtInscrits() {
            const jourData = cacheJoursSemaine.find(j => j.idUnique === idUniqueActif);
            const blocDetails = document.getElementById('bloc-details-parcours');
            const barreBoutons = document.getElementById('carrousel-boutons');
            const btnValider = document.getElementById('btn-valider');
            const formCommentaire = document.getElementById('form-commentaire');
            const inputCommNom = document.getElementById('comm-nom'); const inputCommMsg = document.getElementById('comm-msg');
            const btnCommenter = formCommentaire ? formCommentaire.querySelector('button') : null;

            if (barreBoutons) barreBoutons.innerHTML = ""; 

            let parcoursValides = new Array();
            if (jourData && jourData.parcours && jourData.parcours.length > 0) { 
                parcoursValides = jourData.parcours.filter(p => p.circuit && p.circuit.toString().trim() !== ""); 
            }

            if (!jourData || parcoursValides.length === 0) {
                blocDetails.className = "box-details";
                blocDetails.innerHTML = "<h4>Détails de la journée</h4><span class='no-sortie'>Aucune sortie officielle planifiée ce jour dans l'agenda du club.</span>";
                if (btnValider) btnValider.disabled = true; document.getElementById('nom').disabled = true;
                if (formCommentaire) formCommentaire.style.opacity = "0.4";
                if (inputCommNom) inputCommNom.disabled = true; if (inputCommMsg) inputCommMsg.disabled = true; if (btnCommenter) btnCommenter.disabled = true;
                filtrerInscrits(); filtrerCommentaires(); return;
            }

            if (btnValider) btnValider.disabled = false; document.getElementById('nom').disabled = false;
            if (formCommentaire) formCommentaire.style.opacity = "1";
            if (inputCommNom) inputCommNom.disabled = false; if (inputCommMsg) inputCommMsg.disabled = false; if (btnCommenter) btnCommenter.disabled = false;

            parcoursValides.forEach((p, idx) => {
                const badge = document.createElement('div'); 
                badge.className = "badge-niveau " + p.niveau; // Liaison directe avec le CSS (E-Bleu, E-Rouge, etc.)
                badge.innerText = p.niveau;
                
                badge.onclick = function() {
                    document.querySelectorAll('.badge-niveau').forEach(b => b.classList.remove('actif')); 
                    badge.classList.add('actif');
                    niveauSelectionneActif = p.niveau;
                    
                    blocDetails.className = "box-details fond-" + p.niveau; // Liaison directe avec le fond pastel CSS
                    
                    let openrunnerNettoye = p.openrunner ? p.openrunner.toString().trim() : "";
                    let openrunnerLink = "Tracé N/C";
                    if (openrunnerNettoye !== "") {
                        const urlComplete = openrunnerNettoye.startsWith("http") ? openrunnerNettoye : "https://openrunner.com" + openrunnerNettoye;
                        openrunnerLink = "<a href='" + urlComplete + "' target='_blank'>Tracé OpenRunner</a>";
                    }
                    let kmTxt = p.km ? p.km.toString().trim() + " km" : "N/C"; let denivTxt = p.deniv ? p.deniv.toString().trim() + " m D+" : "N/C";
                    blocDetails.innerHTML = "<strong>Départ :</strong> " + (p.depart || "N/C") + " &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <strong>Pilote :</strong> " + (p.pilote || "Non désigné") + "<br>" + 
                        "<strong>Circuit :</strong> " + openrunnerLink + " (" + kmTxt + " / " + denivTxt + ") &nbsp;•&nbsp; " + p.circuit;
                    
                    const radioBouton = document.querySelector('input[name="niveau"][value="' + p.niveau + '"]');
                    if (radioBouton) radioBouton.checked = true;
                };
                barreBoutons.appendChild(badge); if (idx === 0) badge.click();
            });
            filtrerInscrits(); filtrerCommentaires();
        }
        function filtrerInscrits() {
            const tbody = document.getElementById('liste-participants'); tbody.innerHTML = "";
            let filtres = cacheInscrits.filter(c => c.idUnique === idUniqueActif);
            if (filtres.length === 0) { tbody.innerHTML = "<tr><td colspan='5' id='ligne-aucun'>Aucun inscrit pour le moment.</td></tr>"; uiCompteurs(); return; }
            filtres.forEach(c => uiLigne(c.nom, c.niveau)); uiCompteurs();
        }

        function uiLigne(nom, niveau) {
            const tbody = document.getElementById('liste-participants');
            const aucun = tbody.querySelector('tr'); if (aucun && aucun.querySelector('#ligne-aucun')) aucun.remove();
            let trExistant = null;
            tbody.querySelectorAll('tr').forEach(tr => { if (tr.querySelector('.gauche').innerText.toLowerCase() === nom.toLowerCase()) trExistant = tr; });
            
            const styleVert = "style='width:16%; background-color: #e2f0d9; color: #28a745; font-weight: bold; font-size: 14px;'";
            const styleNormal = "style='width:16%;'";
            
            // FILTRAGE ET COCHES SÉCURISÉES SUR LES CODES BRUTS DU SCRIPT GOOGLE
            const estN1 = (niveau === "E-Bleu" || niveau === "Endurance Bleu");
            const estN2 = (niveau === "E-Rouge" || niveau === "Endurance Rouge");
            const estN3 = (niveau === "P-Rouge" || niveau === "Performance Rouge");
            const estN4 = (niveau === "P-Noir" || niveau === "Performance Noir");
            
            const contenu = "<td class='gauche' style='width:36%;'>" + nom + "</td>" +
                "<td " + (estN1 ? styleVert : styleNormal) + ">" + (estN1 ? "✔️" : "") + "</td>" +
                "<td " + (estN2 ? styleVert : styleNormal) + ">" + (estN2 ? "✔️" : "") + "</td>" +
                "<td " + (estN3 ? styleVert : styleNormal) + ">" + (estN3 ? "✔️" : "") + "</td>" +
                "<td " + (estN4 ? styleVert : styleNormal) + ">" + (estN4 ? "✔️" : "") + "</td>";
                
            if (trExistant) { trExistant.innerHTML = contenu; } else { const tr = document.createElement('tr'); tr.innerHTML = contenu; tbody.appendChild(tr); }
        }

        function uiCompteurs() {
            const lignes = document.getElementById('liste-participants').querySelectorAll('tr');
            let t=0, b=0, er=0, pr=0, n=0;
            lignes.forEach(tr => {
                if(tr.querySelector('#ligne-aucun')) return;
                const tds = tr.querySelectorAll('td');
                if (tds.length >= 5) {
                    t++;
                    if (tds.innerText === "✔️") b++; 
                    if (tds.innerText === "✔️") er++; 
                    if (tds.innerText === "✔️") pr++; 
                    if (tds.innerText === "✔️") n++;
                }
            });
            document.getElementById('total-general').innerText = t; 
            document.getElementById('count-bleu').innerText = "(" + b + ")"; 
            document.getElementById('count-erouge').innerText = "(" + er + ")"; 
            document.getElementById('count-prouge').innerText = "(" + pr + ")"; 
            document.getElementById('count-noir').innerText = "(" + n + ")";
        }

        function filtrerCommentaires() {
            const container = document.getElementById('liste-commentaires'); container.innerHTML = "";
            let filtres = cacheCommentaires.filter(m => m.idUnique === idUniqueActif);
            if (filtres.length === 0) { container.innerHTML = "<p style='color:#aaa; font-style:italic; font-size:13px; padding:4px;'>Aucun échange pour le moment.</p>"; return; }
            filtres.forEach(m => { container.innerHTML += "<p class='ligne-comm' style='font-size:13px !important; padding:4px 8px; margin:0 0 5px 0;'><span class='bulle-nom'>[" + m.nom + "]</span> : " + m.message + "</p>"; });
        }

        document.getElementById('nom').addEventListener('input', function(e) {
            document.getElementById('btn-annuler').style.display = e.target.value.trim().length > 2 ? "inline-block" : "none";
        });

        document.getElementById('form-inscription').addEventListener('submit', async function(e) {
            e.preventDefault(); const btn = document.getElementById('btn-valider'); const inputNom = document.getElementById('nom'); const nom = inputNom.value.trim();
            if(!nom || !niveauSelectionneActif || !idUniqueActif) return;
            btn.disabled = true;
            uiLigne(nom, niveauSelectionneActif);
            cacheInscrits = cacheInscrits.filter(c => !(c.nom.toLowerCase() === nom.toLowerCase() && c.idUnique === idUniqueActif));
            cacheInscrits.push({ nom: nom, niveau: niveauSelectionneActif, idUnique: idUniqueActif }); uiCompteurs();
            document.getElementById('comm-nom').value = nom; inputNom.value = ""; document.getElementById('btn-annuler').style.display = "none";
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "inscrire", nom: nom, niveau: niveauSelectionneActif, idUnique: idUniqueActif }) });
            } catch(err) { console.error(err); }
            btn.disabled = false;
        });

        document.getElementById('btn-annuler').addEventListener('click', async function() {
            const nom = document.getElementById('nom').value.trim(); if(!nom || !idUniqueActif || !confirm("Annuler l'inscription de " + nom + " ?")) return;
            const btnA = document.getElementById('btn-annuler'); btnA.disabled = true;
            cacheInscrits = cacheInscrits.filter(c => !(c.nom.toLowerCase() === nom.toLowerCase() && c.idUnique === idUniqueActif));
            filtrerInscrits(); document.getElementById('nom').value = ""; btnA.style.display = "none";
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "annuler", nom: nom, idUnique: idUniqueActif }) });
            } catch(err) { console.error(err); }
            btnA.disabled = false;
        });

        document.getElementById('form-commentaire').addEventListener('submit', async function(e) {
            e.preventDefault(); const cNom = document.getElementById('comm-nom').value.trim(); const cMsg = document.getElementById('comm-msg').value.trim(); if (!cNom || !cMsg || !idUniqueActif) return;
            cacheCommentaires.push({ nom: cNom, message: cMsg, idUnique: idUniqueActif }); filtrerCommentaires(); document.getElementById('comm-msg').value = "";
            try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "commenter", nom: cNom, message: cMsg, idUnique: idUniqueActif }) }); } catch(err) { console.error(err); }
        });

        chargerDonnees();
    </script>
</body>
</html>
